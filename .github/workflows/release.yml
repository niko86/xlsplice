# The only workflow that builds for more than one platform, and the only one
# that has to be started by hand. This repository is public, so its minutes
# are free and the multiplier a macOS runner used to cost no longer decides
# anything; a release may be built here or on the machines themselves — see
# `docs/releasing.md`. It runs when someone says so and at no other time.
# Nothing here runs on a push, a tag, a pull request or a schedule:
# `test.yml` guards those.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, which must already exist (e.g. v0.1.0)"
        required: true
        type: string
      platforms:
        description: "Which to build. Linux bills at 1x, Windows 2x, macOS 10x."
        required: true
        default: linux
        type: choice
        options:
          - linux
          - all

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing should not hide what the other two would have said.
      fail-fast: false
      # The choice is a matrix, so that asking for one platform bills for one.
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'all'
          && '[{"target":"aarch64-apple-darwin","runner":"macos-latest","archive":"tar.gz"},{"target":"x86_64-pc-windows-msvc","runner":"windows-latest","archive":"zip"},{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","archive":"tar.gz"}]'
          || '[{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","archive":"tar.gz"}]') }}

    steps:
      # The tag, not the branch this was started from: a binary in a release
      # must be a build of the commit the release names.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A tag that disagrees with the manifest would publish a release whose
      # binaries report a different version from their own archive names, so
      # it is caught before anything is built.
      - name: The tag and the manifest must agree
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tagged="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$manifest" ]; then
            echo "tag ${TAG} says $tagged, Cargo.toml says $manifest" >&2
            exit 1
          fi

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary and the skill file, together: a release the agent cannot
      # read is half a release.
      - name: Pack the binary and the skill file
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          name="xlsplice-${TAG}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/xlsplice.exe" "staging/$name/"
          else
            cp "target/${{ matrix.target }}/release/xlsplice" "staging/$name/"
          fi
          cp SKILL.md LICENSE "staging/$name/"
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name"
          else
            tar --create --gzip --file "../$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xlsplice-${{ matrix.target }}
          path: xlsplice-*.tar.gz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: xlsplice-${{ matrix.target }}-zip
          path: xlsplice-*.zip
          if-no-files-found: ignore

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # One job publishes, rather than three racing to create the same
      # release.
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      # A release built here may be the whole release, or one platform
      # arriving late to a release cut by hand. Both are ordinary, so this
      # uploads to the release if there is one and creates it if there is not.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l archives
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" archives/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              archives/*
          fi
