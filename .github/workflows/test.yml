# The only workflow that runs on a push or a pull request. One job on one
# platform, with the cargo cache and with superseded runs cancelled: that was
# once what limited minutes on a private repository allowed, and it stays
# because it is what the suite needs, not because of a bill. Release builds
# have their own workflow, started by hand; the Excel oracle suite never runs
# here, because it drives a real Excel.
#
# One job, two toolchains: the suite runs on stable, and the declared
# `rust-version` is checked afterwards so that the floor is a thing CI holds
# rather than a thing someone remembers to test. See #45.
name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

      # The floor `Cargo.toml` declares, held by something other than memory.
      # CI otherwise only ever builds on stable, so a dependency bump or a
      # newly-used language feature could raise the real floor above the
      # declared one and nothing would notice until someone on that toolchain
      # ran `cargo install --git`.
      #
      # A step rather than a job: one toolchain download plus a check against
      # a warm cache is seconds, where a second job would be a second checkout
      # and a second cache restore for the same answer.
      #
      # The version is read from the manifest rather than written here, so
      # there is one place to change it and no way for the two to drift.
      - name: The declared rust-version still builds
        run: |
          floor=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          echo "Cargo.toml declares rust-version = $floor"
          rustup toolchain install "$floor" --profile minimal --no-self-update
          cargo "+$floor" check --locked --all-targets
