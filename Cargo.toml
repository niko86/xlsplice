[package]
name = "xlsplice"
version = "0.1.1"
edition = "2024"
# The floor, and `src/crash.rs` is what sets it: the panic hook reads
# `PanicHookInfo::payload_as_str`, stable since 1.91.0. Edition 2024 needs
# 1.85 and the let chains in `src/worksheet.rs` need 1.88, so this is the
# binding one. Stated so that a toolchain below it is refused by name, before
# anything compiles, rather than surfacing as an unstable-feature error from
# the middle of the build.
#
# CI holds this rather than trusting it, in `.github/workflows/test.yml`, and
# reads the number from here so it is written once. See #45.
rust-version = "1.91"
license = "MIT"

[dependencies]
# No colour: the contract says human output is plain, so clap's `color`
# feature is left out rather than switched off at runtime.
clap = { version = "4.6.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The container. Deflate is the only method Excel writes, and `zlib-rs` keeps
# it pure Rust so the Linux CI job and the Windows lab machine build the same.
zip = { version = "8.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
# The locator: reads walk the tree, and writes will take node byte ranges from
# the same tree. See ADR-0002.
roxmltree = "0.21.1"
